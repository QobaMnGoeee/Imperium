name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Unpack project
        run: unzip -q framefit.zip
      - name: Geometry self test
        working-directory: framefit
        run: gradle selfTest --no-daemon
        continue-on-error: true
      - name: Build
        working-directory: framefit
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: framefit-jar
          path: framefit/build/libs/*.jar
